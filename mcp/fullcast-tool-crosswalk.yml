note: >-
  THE HEADLINE FINDING: Fullcast's MCP surface and Fullcast's public OpenAPI describe two
  different systems. The only machine-readable REST contract Fullcast publishes
  (assistant.fullcast.io/openapi.json, "Fullcast Assistant API") covers chat sessions,
  assistant configuration and OAuth -- it does not expose territories, accounts, people,
  targets, commissions or documents. Every planning and revenue-operations MCP tool
  therefore has NO backing public REST operation. That is a real surface divergence, not a
  mapping gap: an agent can move an account through MCP but there is no published REST
  operation to do the same thing. The REST endpoints named on Fullcast's own status page
  ("Fullcast Platform API", "Territory Routing API", "Integration API",
  "Authentication Management API") exist but publish no contract, which is what makes MCP
  the only documented programmatic route into the planning data model.
