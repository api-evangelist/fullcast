  note: 'POST tools/list to https://app.fullcast.io/mcp returned HTTP 401 with WWW-Authenticate: Bearer
    realm="mcp-openapi", resource_metadata="https://app.fullcast.io/.well-known/oauth-protected-resource/mcp".
    The server exists and is reachable by an MCP client over HTTPS today; only the tool schemas are auth-gated.
    No stdio package is published on npm or PyPI, so this is a remote-only agent surface.'
  probe_prior: (never probed)
  probe: gated
  probe_why: RFC 9728 challenge on the MCP path only
