servers:
- name: Fullcast MCP
  role: primary
  endpoint: https://app.fullcast.io/mcp
  transport: streamable-http
  auth:
    type: oauth2
    flow: authorization_code
    pkce:
    - S256
    dynamic_client_registration: true
    issuer: https://app.fullcast.io/mcp
    authorization_endpoint: https://app.fullcast.io/mcp/authorize
    token_endpoint: https://app.fullcast.io/mcp/token
    registration_endpoint: https://app.fullcast.io/mcp/register
    metadata: well-known/fullcast-app-mcp-oauth-authorization-server.json
  probe:
    url: https://app.fullcast.io/mcp
    method: POST
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    http_status: 401
    body_returned: '{"code":"MISSING_BEARER","message":"No Bearer token was provided in the Authorization
      header."}'
    checked: '2026-08-13'
- name: Fullcast Assistant MCP Server
  role: secondary
  endpoint: https://assistant.fullcast.io/mcp/
  version: 1.0.0
  transport: streamable-http
  auth:
    type: oauth2
    flow: authorization_code
    pkce:
    - plain
    - S256
    dynamic_client_registration: true
    issuer: https://assistant.fullcast.io
    scopes:
    - openid
    - email
    - profile
    - offline_access
    - mcp:resources
    - mcp:tools
    - mcp:prompts
    metadata: well-known/fullcast-assistant-oauth-authorization-server.json
  capabilities:
    tools: true
    resources: true
    prompts: true
    logging: false
  probe:
    url: https://assistant.fullcast.io/mcp/
    method: POST
    http_status: 401
    body_returned: '{"error": "invalid_token", "error_description": "Authentication required"}'
    checked: '2026-08-13'
  note: A second, smaller MCP server co-hosted with the Fullcast Assistant API. Its /mcp_info endpoint
