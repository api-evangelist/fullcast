note: >-
  Fullcast has no developer sandbox in the usual sense -- there is no test-mode key prefix,
  no magic test identifiers, no fixture or trigger tooling, and no self-serve test tenant.
  What it publishes is (a) a paid "Sandbox Environment" add-on sold per contract, and (b)
  guidance for working against a SALESFORCE sandbox, which is the customer's CRM sandbox and
  not a Fullcast one. Both are recorded honestly below; no test values are invented.
