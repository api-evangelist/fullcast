- name: Staged edits
  kind: in-product-transaction
  self_serve: true
  note: >-
    MCP write tools stage changes that are applied with commit_changes and reversed with
    undo_changes, which is the practical safety mechanism for agent writes given there is no
    test tenant and no idempotency contract.
  tools: [commit_changes, undo_changes]
agent_guidance: >-
  There is no environment in which an agent can rehearse a Fullcast write. Any MCP write tool
  invocation is against production tenant data. Use the staged-edit tools and the
  confirm-first discipline the provider documents for send_document / cancel_document.
