- name: Fullcast Copy.ai Workflows API
  description: The Copy.ai Workflows API, acquired by Fullcast in October 2025 and documented on Fullcast's
    own support host as Fullcast Copy.ai. Programmatically starts GTM workflow runs, polls run status,
    and registers webhooks for workflow lifecycle events. Authenticated with a workspace API key sent
    in the x-copy-ai-api-key header.
