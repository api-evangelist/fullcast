apis:
- name: Fullcast MCP Server
  description: Fullcast's remote Model Context Protocol server, exposing go-to-market planning, territory
    and team hierarchy, coverage, targets, reporting, commissions and document operations to external
    AI clients (Claude, ChatGPT, Agentforce, Cursor). Streamable HTTP transport, OAuth 2.1 with PKCE and
    dynamic client registration. Enabled per tenant under Settings > Application Settings > AI & Agents.
  humanURL: https://support.fullcast.com/docs/set-up-the-model-context-protocol-mcp.md
  baseURL: https://app.fullcast.io/mcp
