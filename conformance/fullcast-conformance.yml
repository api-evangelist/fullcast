    assistant.fullcast.io/openapi.json declares "openapi":"3.1.0" with 18 paths and 24
    operations. Saved to openapi/fullcast-assistant-openapi-original.json.
- id: oauth2
  conforms: true
  evidence: >-
    Two authorization servers, both authorization_code with PKCE:
