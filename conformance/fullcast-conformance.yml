  no longer true: a live OpenAPI 3.1.0 was captured at https://assistant.fullcast.io/openapi.json
  and two OAuth 2.1 authorization servers publish RFC 8414 and RFC 9728 metadata. The
  compliance program below remains as published by the provider.
standards:
