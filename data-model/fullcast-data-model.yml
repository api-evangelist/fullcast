  Assistant API. This is the ASSISTANT domain (conversations, assistants, OAuth clients)
  and is NOT the Fullcast planning data model. The planning entities an agent actually works
  with -- territory, team, product family, account, person, product, plan, target,
  assignment, role, comp plan, credit, ledger entry, document, policy, job, audit entry --
  are reachable only through the MCP tool surface (see mcp/fullcast-tool-crosswalk.yml) and
  are named but not schema-described anywhere public, so they are listed below as
  undocumented rather than modelled.
